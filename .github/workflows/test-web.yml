name: Test web

# Publishes the pilot to the TEST address https://test-pa.parto.at (test cloud parto-private-test, TEST badge)
# with GitHub Pages of this public repository itself (Settings › Pages › Source "GitHub Actions", custom domain
# test-pa.parto.at). No extra repository or token needed. Pilot branches only build and test; main publishes.
on:
  push:
    branches: [main, 'pilot/**']
    paths: ['src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.*', '.env.test', '.github/workflows/test-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: test-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx vite build --mode test
      - name: Prepare site
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
