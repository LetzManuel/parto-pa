name: Server functions

# Deploys supabase/functions/* (ics-relay: reads calendar links for the web app) to the shared private test cloud.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com › Account › Access Tokens, starts with sbp_),
# entered by Manuel; without it the run only warns.
on:
  push:
    branches: [main, 'pilot/**']
    paths: ['supabase/functions/**', '.github/workflows/functions.yml']
  workflow_dispatch:

concurrency: functions-test

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: iclyiqorrjqeeyglbwyx
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::Secret SUPABASE_ACCESS_TOKEN is missing – functions not deployed"; exit 0; fi
          for f in supabase/functions/*/; do
            name=$(basename "$f")
            case "$name" in _*) continue ;; esac   # shared code, not a function
            supabase functions deploy "$name" --project-ref "$REF" --use-api
          done
